name: autofix.ci

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code 🛎
        uses: actions/checkout@v4

      - name: Setup Bun 🌟
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies 📦
        run: bun install
